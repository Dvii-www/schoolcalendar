<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi horario</title>

<!-- Configuración de app instalable (PWA) -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#24303D">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Horario">

<style>
  /* =======================================================
     Paleta: "cuaderno" — papel cálido, tinta azul-noche,
     un solo acento coral para "ahora" y avisos.
     En modo oscuro, el acento pasa de coral a azul.
     ======================================================= */
  :root{
    --papel: #FAF7F2;
    --papel-2: #F5F9FC;
    --tinta: #24303D;
    --tinta-suave: #6B7684;
    --linea: #E4DED2;
    --acento: #D9622B;
    --acento-rgb: 217,98,43;
    --calma: #6E8C82;
    --alerta-bg: #FDECE3;
    --blanco-suave: #EAF2FA;
    --campo-bg: #FCFAF6;
    --boton-bg: #24303D;
    --boton-color: #FAF7F2;
  }
  body.oscuro{
    --papel: #151B23;
    --papel-2: #1E2630;
    --tinta: #E7ECF1;
    --tinta-suave: #8B96A3;
    --linea: #2C3541;
    --acento: #4A90D9;
    --acento-rgb: 74,144,217;
    --calma: #6E8C82;
    --alerta-bg: rgba(74,144,217,0.16);
    --blanco-suave: #EAF2FA;
    --campo-bg: #17212C;
    --boton-bg: #4A90D9;
    --boton-color: #EAF2FA;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--papel);
    color:var(--tinta);
    font-family: -apple-system, Helvetica, Arial, sans-serif;
    transition: background .25s, color .25s;
    color-scheme: light;
  }
  body.oscuro{
    color-scheme: dark;
  }
  .barra-superior{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px 28px 0;
    max-width:640px;
    margin:0 auto;
  }
  .barra-superior h1{
    font-family: Georgia, 'Iowan Old Style', serif;
    font-weight:400;
    font-size:1.4rem;
    margin:0;
  }
  button{
    transition: transform .15s ease, background .2s ease, box-shadow .2s ease, border-color .2s ease, color .2s ease;
  }
  button:active{ transform:scale(0.95); }

  .btn-config{
    width:38px; height:38px;
    border-radius:50%;
    background:var(--papel-2);
    border:1px solid var(--linea);
    font-size:1.05rem;
    cursor:pointer;
  }
  .btn-config:hover{background:#F2ECE0; transform:rotate(35deg);}
  body.oscuro .btn-config:hover{background:var(--linea);}

  .btn-instalar{
    background:var(--acento);
    color:var(--blanco-suave);
    border:none;
    padding:9px 14px;
    border-radius:999px;
    font-size:0.8rem;
    font-family:-apple-system, Helvetica, Arial, sans-serif;
    cursor:pointer;
  }
  .btn-instalar:hover{ transform:translateY(-2px); box-shadow:0 4px 10px rgba(0,0,0,0.15); }

  .selector-dias{
    display:flex;
    gap:8px;
    max-width:640px;
    margin:16px auto 0;
    padding:0 28px;
  }
  .pildora-dia{
    flex:1;
    padding:10px 0;
    text-align:center;
    border-radius:999px;
    border:1px solid var(--linea);
    background:var(--papel-2);
    color:var(--tinta-suave);
    font-size:0.82rem;
    cursor:pointer;
  }
  .pildora-dia:hover{border-color:var(--acento); transform:translateY(-2px);}
  .pildora-dia.activo{
    background:var(--boton-bg);
    color:var(--boton-color);
    border-color:var(--boton-bg);
    font-weight:600;
    transform:scale(1.04);
  }
  .pildora-dia.es-hoy::after{
    content:'';
    display:block;
    width:5px; height:5px;
    border-radius:50%;
    background:var(--acento);
    margin:5px auto 0;
  }
  .pildora-dia.activo.es-hoy::after{ background:var(--papel); }

  .contenedor{
    max-width:640px;
    margin:0 auto;
    padding:18px 28px 60px;
  }

  /* ---------- resumen del día ---------- */
  .tarjeta-dia{
    background:var(--papel-2);
    border:1px solid var(--linea);
    border-radius:18px;
    padding:22px;
    margin-bottom:20px;
    transition: background .25s, border-color .25s;
  }
  .nombre-dia{
    font-family:Georgia, serif;
    font-size:1.15rem;
    margin-bottom:2px;
  }
  .fecha-hoy{
    font-size:0.8rem;
    color:var(--tinta-suave);
    margin-bottom:16px;
  }
  .pista-dia{
    background:#F0EBE0;
    height:10px;
    border-radius:999px;
    overflow:hidden;
    margin-bottom:8px;
  }
  body.oscuro .pista-dia{ background: var(--linea); }
  .relleno-dia{
    height:100%;
    background:var(--acento);
    border-radius:999px;
    transition:width 1s linear, background .25s;
  }
  .texto-progreso-dia{
    font-size:0.78rem;
    color:var(--tinta-suave);
    display:flex;
    justify-content:space-between;
  }

  /* ---------- tarjeta "siguiente clase" ---------- */
  .tarjeta-siguiente{
    background:var(--papel-2);
    border:1px solid var(--linea);
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
    transition: background .3s, border-color .3s, transform .2s;
  }
  .tarjeta-siguiente.alerta{
    background:var(--alerta-bg);
    border-color:var(--acento);
    animation: pulso 1.4s ease-in-out infinite;
  }
  @keyframes pulso{
    0%,100%{ box-shadow:0 0 0 0 rgba(var(--acento-rgb),0.25); }
    50%{ box-shadow:0 0 0 8px rgba(var(--acento-rgb),0); }
  }
  .etiqueta-siguiente{
    font-size:0.75rem;
    color:var(--tinta-suave);
    text-transform:none;
    margin-bottom:6px;
  }
  .nombre-siguiente{
    font-family:Georgia, serif;
    font-size:1.3rem;
  }
  .cuando-siguiente{
    font-size:0.9rem;
    color:var(--acento);
    font-weight:600;
    margin-top:4px;
  }

  /* ---------- tarjetas de materia (nuevo estilo) ---------- */
  .titulo-seccion{
    font-size:0.8rem;
    color:var(--tinta-suave);
    margin:0 0 12px;
  }
  @keyframes entrarTarjetaClase{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .tarjeta-clase{
    --color-materia: var(--acento);
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--papel-2);
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:10px;
    border:1px solid var(--linea);
    border-left:5px solid var(--color-materia);
    opacity:0;
    transform:translateY(14px);
    animation: entrarTarjetaClase .45s ease forwards;
    transition: transform .2s ease, box-shadow .2s ease, opacity .3s ease;
  }
  .tarjeta-clase:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(36,48,61,0.1);
  }
  body.oscuro .tarjeta-clase:hover{
    box-shadow:0 8px 20px rgba(0,0,0,0.35);
  }
  .tarjeta-clase.pasada{
    opacity:0.5 !important;
    transform:translateY(0) !important;
  }
  .tarjeta-clase.pasada:hover{ transform:translateY(0); box-shadow:none; }
  .tarjeta-clase.actual{
    background: var(--alerta-bg);
    background: color-mix(in srgb, var(--color-materia) 12%, var(--papel-2));
    border-color: var(--color-materia);
    box-shadow:0 6px 18px rgba(36,48,61,0.08);
    flex-wrap:wrap;
    position:relative;
    padding-bottom:20px;
  }
  .progreso-clase-actual{
    position:absolute;
    left:16px; right:16px; bottom:8px;
    height:4px;
    background:rgba(0,0,0,0.08);
    border-radius:999px;
    overflow:hidden;
  }
  body.oscuro .progreso-clase-actual{ background:rgba(255,255,255,0.1); }
  .progreso-clase-actual .relleno{
    height:100%;
    background:var(--color-materia);
    transition:width 1s linear;
  }

  /* ---------- marcador de "ahora" entre tarjetas (huecos/recesos) ---------- */
  .marcador-ahora{
    display:flex;
    align-items:center;
    gap:10px;
    margin:-2px 0 10px;
    padding-left:4px;
  }
  .marcador-ahora .punto{
    width:9px; height:9px;
    border-radius:50%;
    background:var(--acento);
    flex-shrink:0;
    animation: latido 1.6s ease-in-out infinite;
  }
  @keyframes latido{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(1.4); opacity:0.6; }
  }
  .marcador-ahora .raya{
    flex:1;
    height:2px;
    background:var(--acento);
    opacity:0.4;
    border-radius:2px;
  }
  .marcador-ahora .texto{
    font-family:-apple-system, Helvetica, Arial, sans-serif;
    font-size:0.72rem;
    color:var(--acento);
    font-weight:600;
    white-space:nowrap;
  }
  .hora-bloque{
    font-family:-apple-system, Helvetica, Arial, sans-serif;
    font-size:0.72rem;
    color:var(--tinta-suave);
    text-align:center;
    line-height:1.5;
    flex-shrink:0;
    width:52px;
  }
  .info-materia{flex:1; min-width:0;}
  .nombre-materia{
    font-size:0.98rem;
    line-height:1.35;
  }
  .tarjeta-clase.actual .nombre-materia{ font-weight:600; }
  .insignia-ahora{
    flex-shrink:0;
    background:var(--color-materia);
    color:var(--blanco-suave);
    text-shadow: 0 1px 1px rgba(0,0,0,0.3);
    font-size:0.68rem;
    font-weight:700;
    letter-spacing:0.5px;
    padding:4px 10px;
    border-radius:999px;
  }

  .vacio-dia{
    color:var(--tinta-suave);
    font-size:0.9rem;
    padding:10px 0 30px;
  }

  /* ---------- panel de configuración ---------- */
  .panel-config{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(36,48,61,0.4);
    z-index:50;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px;
    overflow-y:auto;
  }
  .panel-config.visible{display:flex;}
  .caja-config{
    background:var(--papel-2);
    border-radius:22px;
    padding:24px;
    max-width:480px;
    width:100%;
  }
  .caja-config h2{
    font-family:Georgia, serif;
    font-weight:400;
    font-size:1.2rem;
    margin:0 0 18px;
  }
  .caja-config label{
    display:block;
    font-size:0.75rem;
    color:var(--tinta-suave);
    margin:10px 0 4px;
  }
  .caja-config input, .caja-config select{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--linea);
    border-radius:10px;
    background:var(--campo-bg);
    font-family:inherit;
    font-size:0.9rem;
    color:var(--tinta);
    transition: border-color .2s, background .2s;
  }
  .caja-config input:focus, .caja-config select:focus{
    outline:none;
    border-color:var(--acento);
  }
  .fila-horas{display:flex; gap:10px;}
  .fila-horas > div{flex:1;}
  .dias-semana{
    display:flex;
    gap:6px;
    margin-top:6px;
  }
  .dia-toggle{
    flex:1;
    padding:8px 0;
    text-align:center;
    border:1px solid var(--linea);
    border-radius:999px;
    background:var(--campo-bg);
    font-size:0.78rem;
    cursor:pointer;
    color:var(--tinta-suave);
    transition: transform .15s, background .2s, color .2s, border-color .2s;
  }
  .dia-toggle:hover{ transform:translateY(-2px); border-color:var(--acento); }
  .dia-toggle.activo{
    background:var(--boton-bg);
    color:var(--boton-color);
    border-color:var(--boton-bg);
  }
  .fila-aviso{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:10px;
  }
  .fila-aviso input{width:70px;}
  button{font-family:inherit; cursor:pointer; border:none;}
  .btn-agregar-clase{
    width:100%;
    margin-top:16px;
    background:var(--boton-bg);
    color:var(--boton-color);
    padding:12px;
    border-radius:14px;
    font-size:0.9rem;
  }
  .btn-agregar-clase:hover{ filter:brightness(1.12); transform:translateY(-2px); box-shadow:0 6px 14px rgba(0,0,0,0.15);}

  .lista-clases{margin-top:20px;}
  .fila-clase-config{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--linea);
    font-size:0.85rem;
  }
  .fila-clase-config .info{flex:1;}
  .fila-clase-config .dias-mini{color:var(--tinta-suave); font-size:0.75rem;}
  .btn-quitar{
    background:none;
    color:#B0503A;
    font-size:1rem;
    border-radius:50%;
    width:28px; height:28px;
  }
  .btn-quitar:hover{ background:rgba(176,80,58,0.12); transform:rotate(90deg); }
  .btn-editar{
    background:none;
    color:var(--tinta-suave);
    font-size:0.95rem;
    border-radius:50%;
    width:28px; height:28px;
  }
  .btn-editar:hover{ background:rgba(74,144,217,0.12); color:var(--acento); transform:scale(1.15); }
  .btn-cerrar-config{
    display:block;
    margin:20px auto 0;
    background:none;
    color:var(--tinta-suave);
    font-size:0.85rem;
    text-decoration:underline;
  }
  .notif-fila{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid var(--linea);
  }
  .notif-fila span{font-size:0.82rem; color:var(--tinta-suave);}
  .interruptor{
    position:relative;
    width:42px; height:24px;
    background:var(--linea);
    border-radius:999px;
    cursor:pointer;
    border:none;
    flex-shrink:0;
    transition: background .2s;
  }
  .interruptor::after{
    content:'';
    position:absolute;
    top:3px; left:3px;
    width:18px; height:18px;
    border-radius:50%;
    background:var(--blanco-suave);
    transition:left .18s;
  }
  .interruptor.activo{background:var(--acento);}
  .interruptor.activo::after{left:21px;}
  .btn-notif{
    background:var(--acento);
    color:var(--blanco-suave);
    padding:7px 12px;
    border-radius:999px;
    font-size:0.78rem;
  }
  .btn-notif:hover{ transform:translateY(-2px); box-shadow:0 4px 10px rgba(0,0,0,0.15); }
</style>
</head>
<body>

<div class="barra-superior">
  <h1>Mi horario</h1>
  <div style="display:flex; gap:8px; align-items:center;">
    <button class="btn-instalar" id="btn-instalar" style="display:none;">📲 Instalar</button>
    <button class="btn-config" id="btn-config" title="Configurar">⚙</button>
  </div>
</div>

<div class="selector-dias" id="selector-dias"></div>

<div class="contenedor">

  <div class="tarjeta-dia" id="tarjeta-dia">
    <div class="nombre-dia" id="nombre-dia">—</div>
    <div class="fecha-hoy" id="fecha-hoy"></div>
    <div class="pista-dia" id="pista-dia"><div class="relleno-dia" id="relleno-dia" style="width:0%"></div></div>
    <div class="texto-progreso-dia" id="texto-progreso-dia">
      <span id="texto-progreso-izq">Tu día aún no empieza</span>
      <span id="texto-progreso-der"></span>
    </div>
  </div>

  <div class="tarjeta-siguiente" id="tarjeta-siguiente">
    <div class="etiqueta-siguiente" id="etiqueta-siguiente">Siguiente</div>
    <div class="nombre-siguiente" id="nombre-siguiente">Sin clases configuradas todavía</div>
    <div class="cuando-siguiente" id="cuando-siguiente"></div>
  </div>

  <div class="titulo-seccion">Hoy</div>
  <div class="linea-tiempo" id="linea-tiempo"></div>

</div>

<div class="panel-config" id="panel-config">
  <div class="caja-config">
    <h2>Agregar clase</h2>

    <label>Materia</label>
    <input type="text" id="config-nombre" placeholder="Ej. Química">

    <div class="fila-horas">
      <div>
        <label>Hora inicio</label>
        <input type="time" id="config-inicio">
      </div>
      <div>
        <label>Hora fin</label>
        <input type="time" id="config-fin">
      </div>
    </div>

    <label>Días</label>
    <div class="dias-semana" id="dias-semana">
      <div class="dia-toggle" data-dia="1">L</div>
      <div class="dia-toggle" data-dia="2">M</div>
      <div class="dia-toggle" data-dia="3">M</div>
      <div class="dia-toggle" data-dia="4">J</div>
      <div class="dia-toggle" data-dia="5">V</div>
      <div class="dia-toggle" data-dia="6">S</div>
    </div>

    <div class="fila-aviso">
      <label style="margin:0;">Avisarme</label>
      <input type="number" id="config-aviso" value="5" min="1" max="60">
      <label style="margin:0;">min antes de que empiece</label>
    </div>

    <button class="btn-agregar-clase" id="btn-agregar-clase">Agregar al horario</button>
    <button class="btn-cerrar-config" id="btn-cancelar-edicion" style="display:none;">Cancelar edición</button>

    <div class="notif-fila">
      <span>Modo oscuro</span>
      <button class="interruptor" id="interruptor-oscuro"></button>
    </div>

    <div class="notif-fila">
      <span>Notificaciones del navegador</span>
      <button class="btn-notif" id="btn-notif">Activar</button>
    </div>

    <div class="lista-clases" id="lista-clases"></div>

    <button class="btn-cerrar-config" id="btn-cerrar-config">Cerrar</button>
  </div>
</div>

<script>
/* =======================================================
   Modelo de datos: cada clase es
   { id, nombre, inicio:'HH:MM', fin:'HH:MM', dias:[1..6], aviso:minutos }
   dias usa 1=lunes ... 6=sábado (0=domingo no se ofrece, ajusta si lo necesitas)
   Todo se guarda en localStorage, es un archivo personal tuyo.
   ======================================================= */

const NOMBRES_DIA = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
let diasSeleccionadosForm = new Set();
let notificadas = new Set(); // ids ya notificados hoy, para no repetir

/* ---------- horario precargado (5° "C", COBACH 03 Cacahoatán) ---------- */
const DATOS_INICIALES = [
  { nombre:'Orientación', inicio:'07:50', fin:'08:40', dias:[1] },
  { nombre:'Taller de Pensamiento Variacional I', inicio:'08:40', fin:'09:30', dias:[1] },
  { nombre:'Sistema de Información / Programación', inicio:'10:00', fin:'11:40', dias:[1,2,3] },
  { nombre:'Análisis de Fenómenos y Procesos Biológicos', inicio:'11:40', fin:'12:30', dias:[1,4] },
  { nombre:'Historia de Chiapas', inicio:'12:30', fin:'13:20', dias:[1] },
  { nombre:'Análisis de Fenómenos y Procesos Biológicos', inicio:'07:00', fin:'07:50', dias:[2] },
  { nombre:'La Energía en los Procesos de la Vida Diaria', inicio:'07:50', fin:'08:40', dias:[2] },
  { nombre:'Conciencia Histórica II', inicio:'08:40', fin:'09:30', dias:[2] },
  { nombre:'Análisis de Fenómenos Físicos I', inicio:'11:40', fin:'12:30', dias:[2] },
  { nombre:'Taller de Robótica', inicio:'12:30', fin:'13:20', dias:[2] },
  { nombre:'Historia de Chiapas', inicio:'07:50', fin:'08:40', dias:[3] },
  { nombre:'La Energía en los Procesos de la Vida Diaria', inicio:'08:40', fin:'09:30', dias:[3] },
  { nombre:'Organización de Flujo de Materia y Energía en los Organismos I', inicio:'11:40', fin:'12:30', dias:[3] },
  { nombre:'Conciencia Histórica II', inicio:'12:30', fin:'13:20', dias:[3] },
  { nombre:'Taller de Pensamiento Variacional I', inicio:'07:50', fin:'08:40', dias:[4] },
  { nombre:'Análisis de Fenómenos Físicos I', inicio:'08:40', fin:'09:30', dias:[4] },
  { nombre:'Conciencia Histórica II', inicio:'10:00', fin:'10:50', dias:[4] },
  { nombre:'La Energía en los Procesos de la Vida Diaria', inicio:'10:50', fin:'11:40', dias:[4] },
  { nombre:'Organización de Flujo de Materia y Energía en los Organismos I', inicio:'12:30', fin:'13:20', dias:[4,5] },
  { nombre:'Taller de Pensamiento Variacional I', inicio:'07:00', fin:'07:50', dias:[5] },
  { nombre:'Análisis de Fenómenos Físicos I', inicio:'07:50', fin:'08:40', dias:[5] },
  { nombre:'Taller de Robótica', inicio:'08:40', fin:'09:30', dias:[5] },
  { nombre:'La Energía en los Procesos de la Vida Diaria', inicio:'10:00', fin:'10:50', dias:[5] },
  { nombre:'Historia de Chiapas', inicio:'10:50', fin:'11:40', dias:[5] },
  { nombre:'Sistema de Información / Programación', inicio:'11:40', fin:'12:30', dias:[5] }
].map((c,i)=> ({ id:'inicial-'+i, aviso:5, ...c }));

let clases = [];

function cargarClases(){
  try{
    const guardado = localStorage.getItem('horario-clases');
    clases = guardado ? JSON.parse(guardado) : DATOS_INICIALES;
  }catch(e){ clases = DATOS_INICIALES; }
  guardarClases();
}
function guardarClases(){
  localStorage.setItem('horario-clases', JSON.stringify(clases));
}

/* ---------- helpers de tiempo ---------- */
function horaAMinutos(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  return h*60+m;
}
function minutosATexto(mins){
  const h = Math.floor(mins/60);
  const m = mins%60;
  return h + 'h ' + String(m).padStart(2,'0') + 'min';
}

const NOMBRES_CORTOS = {1:'Lun',2:'Mar',3:'Mié',4:'Jue',5:'Vie'};
const hoyReal = new Date().getDay();
let diaSeleccionado = (hoyReal >= 1 && hoyReal <= 5) ? hoyReal : 1;

function renderSelectorDias(){
  const cont = document.getElementById('selector-dias');
  cont.innerHTML = [1,2,3,4,5].map(d => `
    <button class="pildora-dia ${d===diaSeleccionado?'activo':''} ${d===hoyReal?'es-hoy':''}" data-dia="${d}">
      ${NOMBRES_CORTOS[d]}
    </button>
  `).join('');
  cont.querySelectorAll('.pildora-dia').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      diaSeleccionado = parseInt(btn.dataset.dia, 10);
      renderSelectorDias();
      render();
    });
  });
}

function clasesDelDia(dia){
  return clases
    .filter(c => c.dias.includes(dia))
    .sort((a,b)=> horaAMinutos(a.inicio) - horaAMinutos(b.inicio));
}

/* ---------- render principal ---------- */
function render(){
  const ahora = new Date();
  const minutosAhora = ahora.getHours()*60 + ahora.getMinutes();
  const esHoy = diaSeleccionado === hoyReal;

  document.getElementById('nombre-dia').textContent = NOMBRES_DIA[diaSeleccionado];
  document.getElementById('fecha-hoy').textContent = esHoy
    ? ahora.toLocaleDateString('es-MX', { day:'numeric', month:'long', year:'numeric' })
    : 'Vista previa';

  const clasesDia = clasesDelDia(diaSeleccionado);

  /* --- barra de progreso del día completo (solo tiene sentido si es hoy) --- */
  document.getElementById('pista-dia').style.display = esHoy ? 'block' : 'none';
  document.getElementById('texto-progreso-dia').style.display = esHoy ? 'flex' : 'none';

  if(esHoy){
    if(clasesDia.length === 0){
      document.getElementById('relleno-dia').style.width = '0%';
      document.getElementById('texto-progreso-izq').textContent = 'No tienes clases hoy';
      document.getElementById('texto-progreso-der').textContent = '';
    } else {
      const inicioDia = horaAMinutos(clasesDia[0].inicio);
      const finDia = horaAMinutos(clasesDia[clasesDia.length-1].fin);
      let pct;
      if(minutosAhora <= inicioDia){
        pct = 0;
        document.getElementById('texto-progreso-izq').textContent = 'Tu día empieza en ' + minutosATexto(inicioDia - minutosAhora);
      } else if(minutosAhora >= finDia){
        pct = 100;
        document.getElementById('texto-progreso-izq').textContent = '¡Tu día escolar terminó!';
      } else {
        pct = ((minutosAhora - inicioDia) / (finDia - inicioDia)) * 100;
        document.getElementById('texto-progreso-izq').textContent = Math.round(pct) + '% del día';
      }
      document.getElementById('relleno-dia').style.width = pct + '%';
      document.getElementById('texto-progreso-der').textContent = clasesDia[0].inicio + ' – ' + clasesDia[clasesDia.length-1].fin;
    }
  }

  /* --- siguiente clase (solo aplica viendo el día de hoy) --- */
  const tarjetaSig = document.getElementById('tarjeta-siguiente');
  tarjetaSig.classList.remove('alerta');

  if(!esHoy){
    tarjetaSig.style.display = 'none';
  } else {
    tarjetaSig.style.display = 'block';
    const actual = clasesDia.find(c => minutosAhora >= horaAMinutos(c.inicio) && minutosAhora < horaAMinutos(c.fin));
    const siguiente = clasesDia.find(c => horaAMinutos(c.inicio) > minutosAhora);

    if(actual){
      const faltanParaTerminar = horaAMinutos(actual.fin) - minutosAhora;
      document.getElementById('etiqueta-siguiente').textContent = 'En curso';
      document.getElementById('nombre-siguiente').textContent = actual.nombre;
      document.getElementById('cuando-siguiente').textContent = 'Termina en ' + minutosATexto(faltanParaTerminar);
    } else if(siguiente){
      const faltan = horaAMinutos(siguiente.inicio) - minutosAhora;
      document.getElementById('etiqueta-siguiente').textContent = 'Siguiente';
      document.getElementById('nombre-siguiente').textContent = siguiente.nombre;
      document.getElementById('cuando-siguiente').textContent = 'En ' + minutosATexto(faltan);

      if(faltan <= (siguiente.aviso || 5)){
        tarjetaSig.classList.add('alerta');
        dispararNotificacion(siguiente, faltan);
      }
    } else {
      document.getElementById('etiqueta-siguiente').textContent = clasesDia.length ? 'Listo' : 'Hoy';
      document.getElementById('nombre-siguiente').textContent = clasesDia.length ? 'No te quedan más clases hoy' : 'Sin clases configuradas todavía';
      document.getElementById('cuando-siguiente').textContent = '';
    }
  }

  /* --- tarjetas de materia del día seleccionado --- */
  renderTarjetasClase(clasesDia);
  actualizarEstadosTarjetas(esHoy, minutosAhora);
}

/* Paleta para asignar un color fijo a cada materia (mismo nombre = mismo color siempre) */
const PALETA_MATERIAS = ['#C65523','#3D7BC2','#4F6B62','#9C3D6E','#6B54B0','#A9800F','#2C7A66','#B0503A'];
function colorMateria(nombre){
  let hash = 0;
  for(let i=0;i<nombre.length;i++){ hash = nombre.charCodeAt(i) + ((hash<<5)-hash); }
  return PALETA_MATERIAS[Math.abs(hash) % PALETA_MATERIAS.length];
}

let ultimaFirmaTarjetas = null;

function renderTarjetasClase(clasesDia){
  // firma simple para saber si el contenido cambió (día distinto, clase agregada/quitada)
  const firma = diaSeleccionado + '|' + clasesDia.map(c=>c.id+c.inicio+c.fin).join(',');
  if(firma === ultimaFirmaTarjetas) return; // evita reconstruir (y reanimar) sin necesidad
  ultimaFirmaTarjetas = firma;

  const cont = document.getElementById('linea-tiempo');
  if(clasesDia.length === 0){
    cont.innerHTML = '<div class="vacio-dia">Agrega tus materias desde el ⚙ de arriba.</div>';
    return;
  }
  cont.innerHTML = clasesDia.map((c,i)=>`
    <div class="tarjeta-clase" data-id="${c.id}" data-inicio="${c.inicio}" data-fin="${c.fin}"
         style="--color-materia:${colorMateria(c.nombre)}; animation-delay:${(i*0.06).toFixed(2)}s">
      <div class="hora-bloque"><div>${c.inicio}</div><div>${c.fin}</div></div>
      <div class="info-materia">
        <div class="nombre-materia">${escapeHtml(c.nombre)}</div>
      </div>
    </div>
  `).join('');
}

function actualizarEstadosTarjetas(esHoy, minutosAhora){
  // primero quita cualquier marcador de hueco que haya quedado de un render anterior
  document.querySelectorAll('.marcador-ahora').forEach(m=>m.remove());

  const tarjetas = Array.from(document.querySelectorAll('.tarjeta-clase'));
  let insertoMarcador = false;

  tarjetas.forEach(nodo=>{
    const inicio = horaAMinutos(nodo.dataset.inicio);
    const fin = horaAMinutos(nodo.dataset.fin);
    const esActual = esHoy && minutosAhora >= inicio && minutosAhora < fin;
    const yaPaso = esHoy && minutosAhora >= fin;

    nodo.classList.toggle('actual', esActual);
    nodo.classList.toggle('pasada', yaPaso);

    const yaTieneInsignia = !!nodo.querySelector('.insignia-ahora');
    if(esActual && !yaTieneInsignia){
      const insignia = document.createElement('div');
      insignia.className = 'insignia-ahora';
      insignia.textContent = 'AHORA';
      nodo.appendChild(insignia);
    } else if(!esActual && yaTieneInsignia){
      nodo.querySelector('.insignia-ahora').remove();
    }

    /* --- mini barra de progreso dentro de la clase en curso --- */
    let barra = nodo.querySelector('.progreso-clase-actual');
    if(esActual){
      if(!barra){
        barra = document.createElement('div');
        barra.className = 'progreso-clase-actual';
        barra.innerHTML = '<div class="relleno"></div>';
        nodo.appendChild(barra);
      }
      const pct = ((minutosAhora - inicio) / (fin - inicio)) * 100;
      barra.querySelector('.relleno').style.width = Math.min(100, Math.max(0, pct)) + '%';
    } else if(barra){
      barra.remove();
    }

    /* --- marcador de "ahora" justo antes de la siguiente clase, si estamos en un hueco --- */
    if(esHoy && !insertoMarcador && !esActual && minutosAhora < inicio){
      const marcador = document.createElement('div');
      marcador.className = 'marcador-ahora';
      const faltan = inicio - minutosAhora;
      marcador.innerHTML = `
        <span class="punto"></span>
        <span class="raya"></span>
        <span class="texto">Ahora · próxima en ${faltan} min</span>
      `;
      nodo.parentNode.insertBefore(marcador, nodo);
      insertoMarcador = true;
    }
  });
}

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

/* ---------- modo oscuro ---------- */
function aplicarModoOscuro(activo){
  document.body.classList.toggle('oscuro', activo);
  document.getElementById('interruptor-oscuro').classList.toggle('activo', activo);
}
function cargarModoOscuro(){
  const guardado = localStorage.getItem('horario-modo-oscuro') === '1';
  aplicarModoOscuro(guardado);
}
document.getElementById('interruptor-oscuro').addEventListener('click', ()=>{
  const nuevoEstado = !document.body.classList.contains('oscuro');
  aplicarModoOscuro(nuevoEstado);
  localStorage.setItem('horario-modo-oscuro', nuevoEstado ? '1' : '0');
});

/* ---------- notificaciones del navegador ---------- */
document.getElementById('btn-notif').addEventListener('click', async ()=>{
  if(!('Notification' in window)){ alert('Tu navegador no soporta notificaciones.'); return; }
  const permiso = await Notification.requestPermission();
  const btn = document.getElementById('btn-notif');
  btn.textContent = permiso === 'granted' ? 'Activadas ✓' : 'No activadas';
});

function dispararNotificacion(clase, faltan){
  const clave = clase.id + '-' + new Date().toDateString();
  if(notificadas.has(clave)) return;
  if('Notification' in window && Notification.permission === 'granted'){
    new Notification('Tu horario', { body: `${clase.nombre} empieza en ${faltan} min` });
    notificadas.add(clave);
  }
}

/* ---------- panel de configuración ---------- */
document.getElementById('btn-config').addEventListener('click', ()=>{
  document.getElementById('panel-config').classList.add('visible');
  renderListaConfig();
});
document.getElementById('btn-cerrar-config').addEventListener('click', ()=>{
  limpiarFormularioClase();
  document.getElementById('panel-config').classList.remove('visible');
});

let editandoId = null;

function limpiarFormularioClase(){
  document.getElementById('config-nombre').value = '';
  document.getElementById('config-inicio').value = '';
  document.getElementById('config-fin').value = '';
  document.getElementById('config-aviso').value = 5;
  diasSeleccionadosForm.clear();
  document.querySelectorAll('.dia-toggle').forEach(el=>el.classList.remove('activo'));
  editandoId = null;
  document.getElementById('btn-agregar-clase').textContent = 'Agregar al horario';
  document.getElementById('btn-cancelar-edicion').style.display = 'none';
}

function cargarClaseEnFormulario(c){
  editandoId = c.id;
  document.getElementById('config-nombre').value = c.nombre;
  document.getElementById('config-inicio').value = c.inicio;
  document.getElementById('config-fin').value = c.fin;
  document.getElementById('config-aviso').value = c.aviso;
  diasSeleccionadosForm = new Set(c.dias);
  document.querySelectorAll('.dia-toggle').forEach(el=>{
    el.classList.toggle('activo', diasSeleccionadosForm.has(parseInt(el.dataset.dia,10)));
  });
  document.getElementById('btn-agregar-clase').textContent = 'Guardar cambios';
  document.getElementById('btn-cancelar-edicion').style.display = 'block';
  document.getElementById('config-nombre').scrollIntoView({behavior:'smooth', block:'start'});
}

document.getElementById('btn-cancelar-edicion').addEventListener('click', limpiarFormularioClase);

document.querySelectorAll('.dia-toggle').forEach(el=>{
  el.addEventListener('click', ()=>{
    const dia = parseInt(el.dataset.dia, 10);
    if(diasSeleccionadosForm.has(dia)){
      diasSeleccionadosForm.delete(dia);
      el.classList.remove('activo');
    } else {
      diasSeleccionadosForm.add(dia);
      el.classList.add('activo');
    }
  });
});

document.getElementById('btn-agregar-clase').addEventListener('click', ()=>{
  const nombre = document.getElementById('config-nombre').value.trim();
  const inicio = document.getElementById('config-inicio').value;
  const fin = document.getElementById('config-fin').value;
  const aviso = parseInt(document.getElementById('config-aviso').value, 10) || 5;

  if(!nombre || !inicio || !fin || diasSeleccionadosForm.size === 0){
    alert('Completa materia, horas y al menos un día.');
    return;
  }
  if(horaAMinutos(fin) <= horaAMinutos(inicio)){
    alert('La hora de fin debe ser después de la hora de inicio.');
    return;
  }

  if(editandoId){
    const clase = clases.find(c => c.id === editandoId);
    Object.assign(clase, { nombre, inicio, fin, aviso, dias: Array.from(diasSeleccionadosForm) });
  } else {
    clases.push({
      id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      nombre, inicio, fin,
      dias: Array.from(diasSeleccionadosForm),
      aviso
    });
  }
  guardarClases();
  limpiarFormularioClase();

  renderListaConfig();
  render();
});

function renderListaConfig(){
  const cont = document.getElementById('lista-clases');
  if(clases.length === 0){
    cont.innerHTML = '<div style="color:var(--tinta-suave); font-size:0.85rem; padding:10px 0;">Todavía no has agregado materias.</div>';
    return;
  }
  const letrasDia = {1:'L',2:'M',3:'M',4:'J',5:'V',6:'S'};
  cont.innerHTML = clases.map(c=>`
    <div class="fila-clase-config">
      <div class="info">
        <div>${escapeHtml(c.nombre)} · ${c.inicio}–${c.fin}</div>
        <div class="dias-mini">${c.dias.map(d=>letrasDia[d]).join(' ')} · aviso ${c.aviso} min antes</div>
      </div>
      <button class="btn-editar" data-id="${c.id}" data-accion="editar" title="Editar">✎</button>
      <button class="btn-quitar" data-id="${c.id}" data-accion="borrar" title="Quitar">✕</button>
    </div>
  `).join('');
  cont.querySelectorAll('[data-accion="editar"]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const clase = clases.find(c => c.id === b.dataset.id);
      if(clase) cargarClaseEnFormulario(clase);
    });
  });
  cont.querySelectorAll('[data-accion="borrar"]').forEach(b=>{
    b.addEventListener('click', ()=>{
      clases = clases.filter(c=>c.id !== b.dataset.id);
      guardarClases();
      if(editandoId === b.dataset.id) limpiarFormularioClase();
      renderListaConfig();
      render();
    });
  });
}

/* ---------- app instalable (PWA) ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* si falla, la app sigue funcionando normal en el navegador */ });
  });
}

let eventoInstalacion = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  eventoInstalacion = e;
  document.getElementById('btn-instalar').style.display = 'inline-block';
});

document.getElementById('btn-instalar').addEventListener('click', async ()=>{
  if(!eventoInstalacion) return;
  eventoInstalacion.prompt();
  await eventoInstalacion.userChoice;
  eventoInstalacion = null;
  document.getElementById('btn-instalar').style.display = 'none';
});

window.addEventListener('appinstalled', ()=>{
  document.getElementById('btn-instalar').style.display = 'none';
});

/* ---------- arranque ---------- */
cargarModoOscuro();
cargarClases();
renderSelectorDias();
render();
setInterval(render, 1000);

// limpia el registro de "ya notificadas" cada medianoche aproximada
setInterval(()=>{ notificadas.clear(); }, 1000*60*60*6);
</script>
